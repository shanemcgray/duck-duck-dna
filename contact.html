<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Duck Duck DNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  form { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
  label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  input, textarea {
    font: inherit; padding: 0.7rem 0.9rem; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink);
  }
  input:focus, textarea:focus { outline: 2px solid var(--yolk); outline-offset: 1px; }
  .field { display: flex; flex-direction: column; gap: 0.35rem; }
  .error { color: #C4432B; font-size: 0.8rem; min-height: 1.1em; }
  button[type="submit"] {
    align-self: flex-start; font: inherit; font-weight: 600; background: var(--ink); color: var(--paper);
    border: none; border-radius: 999px; padding: 0.7rem 1.5rem; cursor: pointer;
  }
  #formStatus { font-size: 0.9rem; margin-top: 0.5rem; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-mark" href="index.html">🦆</a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="contact.html" aria-current="page">Contact</a></li>
  </ul>
</nav>

<main class="page">
  <p class="kicker">Contact</p>
  <h1>Get in touch</h1>
  <p>This form validates in your browser only — hook it up to a service like Formspree, or your own backend, to actually receive messages.</p>

  <form id="contactForm" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name">
      <span class="error" id="nameError"></span>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email">
      <span class="error" id="emailError"></span>
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5"></textarea>
      <span class="error" id="messageError"></span>
    </div>
    <button type="submit">Send message</button>
    <p id="formStatus" role="status"></p>
  </form>
</main>

<footer>&copy; <span id="year"></span> Duck Duck DNA</footer>

<script src="js/main.js"></script>
<script>
  const form = document.getElementById('contactForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let valid = true;

    const name = document.getElementById('name');
    const nameError = document.getElementById('nameError');
    nameError.textContent = '';
    if (!name.value.trim()) { nameError.textContent = 'Please enter your name.'; valid = false; }

    const email = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    emailError.textContent = '';
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email.value.trim())) { emailError.textContent = 'Please enter a valid email.'; valid = false; }

    const message = document.getElementById('message');
    const messageError = document.getElementById('messageError');
    messageError.textContent = '';
    if (message.value.trim().length < 10) { messageError.textContent = 'Message should be at least 10 characters.'; valid = false; }

    const status = document.getElementById('formStatus');
    if (valid) {
      status.textContent = 'Looks good! Connect this form to a backend to actually send it.';
      status.style.color = '#2F6F4E';
    } else {
      status.textContent = '';
    }
  });
</script>
</body>
</html>
