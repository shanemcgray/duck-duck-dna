<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duck Duck DNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <a class="nav-mark" href="index.html">🦆</a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html" aria-current="page">Home</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>

<div id="wiki-summary">
    Loading Wikipedia...
</div>


</main>

<footer>&copy; <span id="year"></span> Duck Duck DNA</footer>

<script src="js/main.js"></script>
<script>
fetch("https://en.wikipedia.org/api/rest_v1/page/summary/Duck")
    .then(response => response.json())
    .then(data => {
        let html = `
            <h2>${data.title}</h2>
        `;

        if (data.thumbnail) {
            html += `
                <img src="${data.thumbnail.source}"
                     alt="${data.title}"
                     style="max-width:250px; display:block; margin-bottom:10px;">
            `;
        }

        html += `
            <p>${data.extract}</p>
            <p>
                <a href="${data.content_urls.desktop.page}" target="_blank">
                    Read the full article on Wikipedia →
                </a>
            </p>
        `;

        document.getElementById("wiki-summary").innerHTML = html;
    })
    .catch(error => {
        document.getElementById("wiki-summary").innerHTML =
            "Couldn't load Wikipedia article.";
        console.error(error);
    });
</script>

  
</body>
</html>
